name: Run MLB DFS Projection Model

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 16:00 UTC (12:00 PM ET)
    - cron: '0 16 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run MLB Pipeline Script
        env:
          GOOGLE_WEBAPP_URL: ${{ secrets.GOOGLE_WEBAPP_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
